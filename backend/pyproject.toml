[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-teacher-live"
version = "0.1.0"
description = "Live AI Teacher — a voice-first, human-feeling tutor backed by Hugging Face Inference."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
ai-teacher-live = "ai_teacher_live.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_teacher_live"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
