<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maya — your live AI teacher</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="avatar" aria-hidden="true">
          <span class="avatar__emoji">👩‍🏫</span>
          <span class="avatar__pulse" id="speakingPulse"></span>
        </div>
        <div class="app__title">
          <h1>Maya</h1>
          <p class="app__subtitle" id="status">tap the mic and ask me anything</p>
        </div>
        <button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </header>

      <section class="transcript" id="transcript" aria-live="polite">
        <div class="bubble bubble--teacher">
          <p>Hey, I'm Maya. I'll teach you basically anything — math, code, languages, history, you name it. Tap the mic and ask me a question, or pick a topic and we'll dive in. What's on your mind?</p>
        </div>
      </section>

      <section class="composer">
        <button class="mic" id="micBtn" aria-pressed="false" aria-label="Hold to talk">
          <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
            <path d="M12 19v3"/>
          </svg>
          <span class="mic__ring" id="micRing"></span>
        </button>
        <div class="composer__hint">
          <input type="text" id="textInput" placeholder="…or type your question and press Enter" autocomplete="off" />
        </div>
        <button class="iconbtn" id="stopBtn" title="Stop talking" aria-label="Stop talking">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </section>

      <footer class="app__footer">
        <span id="modelLabel">model: …</span>
        <span class="dot">·</span>
        <span id="backendLabel">backend: …</span>
      </footer>
    </main>

    <dialog id="settingsDialog" class="settings">
      <form method="dialog" class="settings__form">
        <h2>Settings</h2>
        <label>
          Your name
          <input id="studentName" type="text" placeholder="friend" />
        </label>
        <label>
          Topic focus <span class="muted">(optional)</span>
          <input id="subject" type="text" placeholder="e.g. linear algebra, Spanish, recursion" />
        </label>
        <label>
          Voice
          <select id="voiceSelect"></select>
        </label>
        <label>
          Backend URL
          <input id="backendUrl" type="url" placeholder="https://your-backend.fly.dev" />
        </label>
        <label class="row">
          <input id="autoListen" type="checkbox" />
          Auto-listen after Maya finishes speaking
        </label>
        <div class="settings__actions">
          <button value="cancel">Cancel</button>
          <button value="default" id="saveSettings" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
